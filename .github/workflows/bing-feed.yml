name: Bing Shopping feed

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate feed
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          STORE_URL: https://noavvo.com
        run: python bing_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "noavvo-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.txt
          git diff --cached --quiet || git commit -m "Update Bing Shopping feed"
          git push
